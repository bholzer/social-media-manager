services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: smm
      POSTGRES_PASSWORD: smm
      POSTGRES_DB: smm
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smm"]
      interval: 5s
      timeout: 3s
      retries: 5

  db-test:
    image: postgres:17
    environment:
      POSTGRES_USER: smm
      POSTGRES_PASSWORD: smm
      POSTGRES_DB: smm_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smm"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: uv run uvicorn smm.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://smm:smm@db:5432/smm
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src

  worker:
    build: .
    command: uv run dramatiq smm.workers.tasks
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://smm:smm@db:5432/smm
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src

volumes:
  pgdata:
